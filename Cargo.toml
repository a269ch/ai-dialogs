[package]
name = "ai-dialogs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0"
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4"] }
walkdir = "2.5.0"
